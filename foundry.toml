[package]
name = "raindex-interface"
version = "0.1.5"

[profile.default]
src = 'src'
out = 'out'
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"

# Try to make sure the optimizer doesn't touch the output in a way that can break
# source maps for debugging.
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# These settings should be used for snapshots
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

evm_version = "cancun"

[dependencies]
forge-std = "1.17.0"
rainlang = "0.2.37"
rain-math-float = "0.3.13"
rain-intorastring = "0.1.4"
rain-lib-memkv = "0.2.0"
rain-lib-typecast = "0.1.4"
rain-math-binary = "0.1.4"
rain-math-float-deploy = "0.1.11"
rain-metadata = "0.1.46"
rain-sol-codegen = "0.1.39"
rain-solmem = "0.1.28"
rain-string = "0.3.11"
rain-tofu-erc20-decimals = "0.1.5"

[soldeer]
recursive_deps = false

[fuzz]
runs = 2048
